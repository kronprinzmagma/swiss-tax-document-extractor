# privacy_secrets.local.yaml — Template (KEINE echten PII committen!)
#
# Echte Datei heisst `privacy_secrets.local.yaml` (gitignored). Sie wird
# vom Anonymizer (scripts/anonymize_belege.py) und vom Privacy-Gate
# (scripts/privacy_gate.py) geladen, NICHT von der Extraktion.
#
# Zweck: PII jenseits der family.yaml deklarativ erfassen — Firmen, Banken,
# Stiftungen, Kontonummern, weitere Personen (z.B. mitversicherte
# Verwandte), Adressen, Geburtsdaten.
#
# Alle Einträge sind optional; fehlende Keys sind ok.

institutions:
  banks:
    - "Demo-Bank AG"
    - "DemoBank"
  kk:
    - "Demo-Krankenkasse"
  brokers:
    - "Demo-Broker AG"
  stiftungen:
    - "Demo-Vorsorgestiftung"
  arbeitgeber:
    - "Demo-Arbeitgeber AG"
  kitas:
    - "Demo-Kita"
  weitere:
    - "Demo-Apotheke AG"

persons:
  - "Demo Verwandter"
  - "D. Verwandter"

iban_account_numbers:
  - "00-000000-0"
  - "000.000.000"

addresses:
  - "Musterstrasse 12"
  - "8000 Musterhausen"

birthdates:
  # ISO oder DD.MM.YYYY akzeptiert
  - "1900-01-01"
  - "01.01.1900"
